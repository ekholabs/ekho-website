name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types and templates
        run: npm run check

      - name: Build
        run: npm run build

      - name: Custom domain is intact
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — the custom domain would be dropped on deploy"; exit 1; }
          diff <(printf 'ekholabs.eu\n') dist/CNAME || { echo "::error::dist/CNAME is not ekholabs.eu"; exit 1; }

      - name: No broken internal links
        run: node tools/check-links.mjs
